<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">VOTILT — legenda delle quattro forme di posizione</title>
  <desc id="desc">Esempi grafici, non premi assegnati: oro circolare per primo, argento arrotondato per secondo, bronzo a rombo per terzo, pillola ciano numerata dal quarto al centesimo. Categoria sotto.</desc>
  <rect width="1080" height="360" rx="28" fill="#090711"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="540" y="47" fill="#22D3EE" font-size="17" letter-spacing="3">LEGENDA · ESEMPI GRAFICI</text>
    <text x="540" y="80" fill="#DDD6E9" font-size="15">Posizione corrente nella categoria · possibili ex aequo</text>
    <circle cx="150" cy="171" r="42" fill="#171222" stroke="#F5D477" stroke-width="4"/>
    <rect x="368" y="129" width="84" height="84" rx="18" fill="#171222" stroke="#D5DCEA" stroke-width="4"/>
    <rect x="628" y="129" width="84" height="84" rx="5" transform="rotate(45 670 171)" fill="#171222" stroke="#D89E78" stroke-width="4"/>
    <rect x="878" y="135" width="104" height="72" rx="29" fill="#171222" stroke="#22D3EE" stroke-width="2"/>
    <text x="150" y="185" font-size="42" fill="#F5D477">1</text>
    <text x="410" y="185" font-size="42" fill="#D5DCEA">2</text>
    <text x="670" y="185" font-size="42" fill="#D89E78">3</text>
    <text x="930" y="183" font-size="33" fill="#22D3EE">#37</text>
    <g font-size="16" fill="#F8F6FF"><text x="150" y="263">Categoria</text><text x="410" y="263">Categoria</text><text x="670" y="263">Categoria</text><text x="930" y="263">Categoria</text></g>
    <g font-size="13" fill="#AEA5BD"><text x="150" y="291">primo</text><text x="410" y="291">secondo</text><text x="670" y="291">terzo</text><text x="930" y="291">dal quarto al centesimo</text></g>
    <text x="540" y="334" font-size="13" fill="#AEA5BD">Rappresenta preferenze della comunità, senza certificare competenza o verità.</text>
  </g>
</svg>
